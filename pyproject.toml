[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketmind-tr"
version = "0.2.0"
description = "Türkçe destek talepleri için açıklanabilir NLP başlangıç projesi"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
transformer = ["torch>=2.6,<3", "transformers>=4.57,<5", "safetensors>=0.6,<1"]

[project.scripts]
ticketmind-train = "ticketmind.train:main"
ticketmind-predict = "ticketmind.predict:main"
ticketmind-compare = "ticketmind.experiments:main"
ticketmind-entity-eval = "ticketmind.entity_eval:main"
ticketmind-rag-eval = "ticketmind.rag_eval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

